name: Keep Render awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health check
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 90 https://social-uploader-r3j2.onrender.com/healthz && exit 0
            sleep 20
          done
          exit 1
